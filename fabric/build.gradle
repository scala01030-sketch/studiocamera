plugins { id 'net.fabricmc.fabric-loom-remap' version '1.14.10'; id 'maven-publish' }
version = '0.1.0'
group = 'studio.camera'
base { archivesName = 'studiocamera-fabric-1.21.11' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
sourceSets.test.java.srcDir '../common/src/test/java'
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) { from('../LICENSE') }
